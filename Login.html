<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --color1: #e25c1d;
            --color2: #ec8723;
            --color3: #57c0b6;
            --color4: #581d11;
            --color5: #fce5c2;
            --color6: #e07f72;
            --color7: #9d4624;
            --color8: #d56863;
            --color9: #e27f74;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e27f74, #fce5c2);
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 900px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;

        }

        .col-lg-6 {
            padding: 20px 50px;
        }

        .form-control {
            border: 1px solid #fce5c2;
            background-color: #fce5c2;
            height: 40px;
        }

        .form-control:focus {
            border: 1px solid #d56863;
            box-shadow: 0 0 0 0.2rem #fce5c2;
        }

        .btn-custom {
            padding: 5px 10px;
            width: 100%;
            border: #ec8723 2px solid;
            background-color: white;
            color: black;
            height: 40px;
        }

        .btn-custom:hover {
            border: #fce5c2 2px solid;
            background-color: #57c0b6;
            color: black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="login-container mx-auto">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <span class="d-flex justify-content-center">
                        <img src="images/logo.png" alt="" class="logo d-flex mb-5" width="200px" />
                    </span>
                    <h2 class="text-center fw-bold mb-4">Selamat Datang di Toko Tas</h2>
                    <p class="text-center fs-5 mb-5">
                        Tempat Tas terbagus dan harga terjangkau
                    </p>
                    <ul class="list-unstyled">
                        <li class="mb-2 fs-5">
                            <i class="fas fa-check-circle fs-4"></i>
                            setiap barang aman
                        </li>
                    </ul>
                    <ul class="list-unstyled">
                        <li class="mb-2 fs-5">
                            <i class="fas fa-check-circle fs-4"></i>
                            banyak pilihan
                        </li>
                    </ul>
                    <ul class="list-unstyled">
                        <li class="mb-2 fs-5">
                            <i class="fas fa-check-circle fs-4"></i>
                            harga terjangkau
                        </li>
                    </ul>
                </div>
                <div class="col-lg-6" style="background-color: var(--color9);">
                    <div class="login-right">
                        <h3 class="text-center my-3 fw-bold" style="color: var(--color5);">Toko Tas</h3>
                        <h5 class="text-center mb-5" style="color: var(--color5);">Masuk Ke Akun Anda</h5>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label> <br>
                            <input type="text" class="form-control" id="username" name="username" /> <br>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label> <br>
                            <input type="password" name="password" id="password" class="form-control" /> <br>
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-custom">Masuk</button> <br>
                            <p class="text-center mt-3"> <br>
                                Belum punya akun?
                                <a href="register.html" style="color: var(--color3)">Daftar</a>
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

                                                                                          </html>
